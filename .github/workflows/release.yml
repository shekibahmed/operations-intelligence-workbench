name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Require the tag to match the MCP package identity
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const pkg = JSON.parse(readFileSync('packages/mcp-server/package.json', 'utf8'));
            const server = JSON.parse(readFileSync('packages/mcp-server/server.json', 'utf8'));
            const tag = process.argv[1];
            const problems = [];
            if (pkg.private === true) problems.push('package is still private');
            if (pkg.version !== tag) problems.push('package version ' + pkg.version + ' != tag ' + tag);
            if (server.version !== pkg.version) problems.push('server.json version != package version');
            if (server.packages?.[0]?.version !== pkg.version) problems.push('server.json package version != package version');
            if (server.packages?.[0]?.identifier !== pkg.name) problems.push('server.json identifier != package name');
            if (pkg.mcpName !== server.name) problems.push('mcpName != server.json name');
            if (typeof server.description !== 'string' || server.description.length === 0 || server.description.length > 100) {
              problems.push('server.json description must be 1..100 characters');
            }
            if (problems.length > 0) {
              console.error(problems.join('\n'));
              process.exit(1);
            }
          " "$tag"

      - name: Publish @oiw/mcp-server
        run: pnpm --filter @oiw/mcp-server publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
