name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Require the tag to match the MCP package identity
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const pkg = JSON.parse(readFileSync('packages/mcp-server/package.json', 'utf8'));
            const server = JSON.parse(readFileSync('packages/mcp-server/server.json', 'utf8'));
            const tag = process.argv[1];
            const problems = [];
            if (pkg.private === true) problems.push('package is still private');
            if (pkg.version !== tag) problems.push('package version ' + pkg.version + ' != tag ' + tag);
            if (server.version !== pkg.version) problems.push('server.json version != package version');
            if (server.packages?.[0]?.version !== pkg.version) problems.push('server.json package version != package version');
            if (server.packages?.[0]?.identifier !== pkg.name) problems.push('server.json identifier != package name');
            if (pkg.mcpName !== server.name) problems.push('mcpName != server.json name');
            if (typeof server.description !== 'string' || server.description.length === 0 || server.description.length > 100) {
              problems.push('server.json description must be 1..100 characters');
            }
            if (problems.length > 0) {
              console.error(problems.join('\n'));
              process.exit(1);
            }
          " "$tag"

      - name: Publish @oiw/mcp-server
        run: pnpm --filter @oiw/mcp-server publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp-registry:
    # Runs after npm has the package: the registry checks the published
    # tarball's mcpName against server.json name. GitHub OIDC proves the
    # io.github.shekibahmed/ namespace, so no registry token is stored.
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      # Pinned and Sigstore-verified. Change deliberately; never use releases/latest.
      MCP_PUBLISHER_VERSION: v1.8.8
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP registry
        working-directory: packages/mcp-server
        run: ../../mcp-publisher publish
