name: Expire demo workspaces

on:
  # Manual only. The hourly schedule is disabled until a production
  # DATABASE_URL secret exists; without it every scheduled run fails and
  # sends a failure alert. Re-enable by restoring the schedule trigger:
  #   schedule:
  #     - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      before:
        description: "Optional ISO cutoff override, forwarded as --before (empty = default TTL cutoff)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # scripts/expire-demo.ts imports built package output (dist/).
      - run: pnpm build

      - name: Expire guest workspaces
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set"; exit 1
          fi
          if [ -n "${{ github.event.inputs.before }}" ]; then
            pnpm demo:expire --before "${{ github.event.inputs.before }}"
          else
            pnpm demo:expire
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
