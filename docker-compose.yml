services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oiw
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oiw"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - oiw-postgres-data:/var/lib/postgresql/data

volumes:
  oiw-postgres-data:
