packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild

# Security floors for transitive dependencies (Dependabot alerts, 2026-10-18).
# Remove an entry once every parent's own range already excludes the
# vulnerable versions.
overrides:
  "undici@<8.10.2": "^8.10.2"
  "source-map-js@<1.2.2": "^1.2.2"
  "brace-expansion@>=1 <1.1.21": "^1.1.21"
  "brace-expansion@>=5 <5.0.12": "^5.0.12"
